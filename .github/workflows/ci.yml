name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    strategy:
      # One platform failing must not cancel the others: the whole point of a matrix is learning which
      # platforms differ, and fail-fast turns three answers into one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # better-sqlite3 ships a win32-x64 prebuild in its tarball, but it also ships a binding.gyp with no
      # install script, so npm injects `node-gyp rebuild` and compiles it anyway — on every platform. Linux and
      # macOS have a compiler and nobody noticed; Windows does not, and node-gyp 11.5 cannot identify the
      # runner's Visual Studio 18 (its PowerShell probe overflows its own stdio buffer, then reads the version
      # as "undefined"). Running the install inside a developer command prompt sidesteps the detection entirely:
      # vcvars has already put the compiler, INCLUDE and LIB in the environment, so there is nothing to find.
      - name: Install inside a Visual Studio developer prompt
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" ( echo vswhere.exe is not at its documented path & exit /b 1 )
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH ( echo vswhere found no Visual Studio carrying the C++ tools & exit /b 1 )
          echo Using %VSPATH%
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" && npm ci
      - name: Install
        if: runner.os != 'Windows'
        run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Every definition-of-done suite, in order. `npm ci` installs Deno as a devDependency, so the sandbox
      # exists here and the execute-tier cases actually run rather than skipping.
      - run: npx deno --version
      # windows-latest defaults to pwsh, where this loop is a syntax error rather than a test failure.
      # Git Bash ships on the Windows runners, so one shell covers all three platforms.
      - shell: bash
        run: |
          for n in 00 01 02 03 04 05 06 07 08 09 12; do
            npm run dod -- $n || exit 1
          done
  # The other half of SEC-23: a machine with no Deno on it. The execute tier must be unavailable by name, and
  # nothing may fall back to running code in this process.
  no-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: remove Deno so this is really a machine without one
        run: rm -rf node_modules/deno node_modules/.bin/deno node_modules/@deno
      - run: '! command -v deno'
      - run: npm run build
      # `npm run dod -- 09` runs the browser case tagged @run-09 as well, and that case is the point here: it is
      # the one that reads the "no sandbox" copy on the Tools screen.
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run --project security tests/security/sec-21-24-sandbox.test.ts
      - run: npm run dod -- 09

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-workbench:ci .
      - run: bash scripts/docker-smoke.sh ai-workbench:ci
